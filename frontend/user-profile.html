<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Campus Feed</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' * 'unsafe-inline' 'unsafe-eval' data: blob:;">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* ================= NAVIGATION ================= */
        nav {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #222;
            padding: 12px 10px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav button {
            background: transparent;
            color: #a3a3a3;
            border: 1px solid transparent;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        nav button i {
            font-size: 0.95rem;
        }

        nav button:hover {
            color: #000000;
            background: #ffffff;
            border-color: #ffffff;
        }

        /* ================= CONTAINER & CARDS ================= */
        .container {
            padding: 25px 20px 60px 20px;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background: #0a0a0a;
            border: 1px solid #262626;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        /* User Avatar Styling */
        #userPic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
            margin-bottom: 15px;
            background: #1e1e1e;
        }

        .profile-name {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: -0.01em;
            color: #ffffff;
        }

        /* Info Grid Layout */
        .info-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            text-align: left;
        }

        .info-box {
            background: #000000;
            border: 1px solid #262626;
            padding: 12px 16px;
            border-radius: 10px;
        }

        .info-box span.label {
            display: block;
            font-size: 11px;
            color: #737373;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .info-box span.value {
            font-size: 14px;
            color: #fff;
            font-weight: bold;
            word-break: break-all;
        }

        /* ================= ACTION BUTTONS ================= */
        .btn-message {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            width: 100%;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-message:hover {
            opacity: 0.88;
        }

        /* ================= POSTS SECTION ================= */
        .posts-header h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            letter-spacing: -0.01em;
            border-bottom: 1px solid #262626;
            padding-bottom: 10px;
            color: #ffffff;
        }

        .posts-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .post-card {
            background: #0a0a0a;
            border: 1px solid #262626;
            border-radius: 16px;
            padding: 18px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .post-card h4 {
            font-size: 1.05rem;
            color: #fff;
        }

        .post-card p {
            font-size: 0.95rem;
            color: #d4d4d4;
            line-height: 1.5;
        }

        .post-meta {
            display: flex;
            gap: 15px;
            font-size: 0.78rem;
            color: #737373;
            margin-top: 5px;
        }

        .post-card img {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #262626;
            max-height: 400px;
            object-fit: cover;
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 500px) {
            nav button {
                font-size: 0.75rem;
                padding: 6px 8px;
                gap: 4px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px 12px 50px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Main Navigation Bar -->
    <nav>
        <button onclick="location.href='feed.html'">
            <i class="fa-solid fa-house"></i>
            <span>Feed</span>
        </button>
        <button onclick="location.href='create-post.html'">
            <i class="fa-solid fa-square-plus"></i>
            <span>Post</span>
        </button>
        <button onclick="location.href='inbox.html'">
            <i class="fa-solid fa-paper-plane"></i>
            <span>Inbox</span>
        </button>
        <button onclick="location.href='profile.html'">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </button>
    </nav>

    <!-- Main Content Area -->
    <div class="container">
        
        <!-- Profile Card -->
        <div class="card">
            <img id="userPic" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23a3a3a3'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.8-.85-5.05-2.2.03-1.68 3.37-2.6 5.05-2.6s5.02.92 5.05 2.6C15.8 19.15 14.03 20 12 20z'/></svg>" alt="Profile Picture">
            <h2 id="userName" class="profile-name">Loading...</h2>

            <!-- Structured User Information Grid -->
            <div class="info-grid">
                <div class="info-box">
                    <span class="label">Email</span>
                    <span class="value" id="userEmail">-</span>
                </div>
                <div class="info-box">
                    <span class="label">Matric Number</span>
                    <span class="value" id="userMatric">-</span>
                </div>
                <div class="info-box">
                    <span class="label">Campus Points</span>
                    <span class="value" id="userPoints">0</span>
                </div>
                <div class="info-box">
                    <span class="label">Status</span>
                    <span class="value" style="color: #ffffff;">Verified Student</span>
                </div>
            </div>
        </div>

        <!-- Direct Action Section -->
        <button class="btn-message" onclick="goToChat()">
            💬 Message this Student
        </button>

        <!-- Posts Section -->
        <div class="posts-header">
            <h3>Posts by this Student</h3>
            <div id="userPosts" class="posts-grid"></div>
        </div>

    </div>

    <!-- Configuration and Profile Logic -->
    <script src="js/config.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const targetUserId = params.get("id");
        
        const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23a3a3a3'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.8-.85-5.05-2.2.03-1.68 3.37-2.6 5.05-2.6s5.02.92 5.05 2.6C15.8 19.15 14.03 20 12 20z'/></svg>";

        async function loadPublicProfile() {
            if (!targetUserId) {
                document.getElementById("userName").textContent = "No user specified";
                return;
            }

            try {
                const res = await fetch(`${BASE_URL}/auth/user/${targetUserId}`);
                
                if (!res.ok) {
                    throw new Error("User not found in database");
                }

                const user = await res.json();
                if (!user) {
                    throw new Error("Empty user data received");
                }

                document.getElementById("userName").textContent = user.name || "Student";
                document.getElementById("userEmail").textContent = user.email || "-";
                document.getElementById("userMatric").textContent = user.matric || user.matric_no || "-";
                document.getElementById("userPoints").textContent = user.points || 0;
                
                const userPicEl = document.getElementById("userPic");
                if (userPicEl) {
                    userPicEl.src = user.profile_image 
                        ? `${BASE_URL}/uploads/${user.profile_image}` 
                        : DEFAULT_AVATAR;
                }

                loadUserPosts();

            } catch (err) {
                console.error("Error loading profile:", err);
                document.getElementById("userName").textContent = "User not found";
                const postsContainer = document.getElementById("userPosts");
                if (postsContainer) {
                    postsContainer.innerHTML = "<p style='color:#a3a3a3; text-align:center;'>Could not load this user's profile.</p>";
                }
            }
        }

        async function loadUserPosts() {
            try {
                const res = await fetch(`${BASE_URL}/posts/user/${targetUserId}`);
                if (!res.ok) return;
                
                const posts = await res.json();

                const postsContainer = document.getElementById("userPosts");
                if (!postsContainer) return;
                
                postsContainer.innerHTML = ""; 

                if (!posts || posts.length === 0) {
                    postsContainer.innerHTML = "<p style='color:#737373; text-align:center; padding: 20px 0;'>This student hasn't posted anything yet.</p>";
                    return;
                }

                let postsHTML = "";
                posts.forEach(post => {
                    postsHTML += `
                        <div class="post-card">
                            <h4>${escapeHTML(post.title || "Untitled Post")}</h4>
                            <p>${escapeHTML(post.description || "")}</p>
                            
                            ${post.image ? `<img src="${BASE_URL}/uploads/${post.image}" alt="Post Image">` : ""}
                            
                            <div class="post-meta">
                                <span>📍 ${escapeHTML(post.location || "Campus")}</span>
                                <span>📅 ${escapeHTML(post.date || "Recently")} ${escapeHTML(post.time || "")}</span>
                            </div>
                        </div>
                    `;
                });
                postsContainer.innerHTML = postsHTML;

            } catch (err) {
                console.error("Error loading posts:", err);
                const postsContainer = document.getElementById("userPosts");
                if (postsContainer) {
                    postsContainer.innerHTML = "<p style='color:#737373;'>Error loading posts.</p>";
                }
            }
        }

        function goToChat() {
            if (targetUserId) {
                window.location.href = `chat.html?id=${targetUserId}`;
            }
        }

        function escapeHTML(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initialize Page
        loadPublicProfile();
    </script>
</body>
</html>
