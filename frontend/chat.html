<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #000;
        color: #fff;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
    }

    /* ================= CHAT HEADER ================= */

    .chat-header {
        background: #000;
        padding: 12px 15px;
        display: flex;
        align-items: center;
        gap: 15px;
        border-bottom: 1px solid #333;
        flex-shrink: 0;
    }

    .back-btn {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 1.5rem;
        cursor: pointer;
        padding: 5px 10px;
        border-radius: 50%;
        transition: 0.2s ease;
    }

    .back-btn:hover {
        background: #fff;
        color: #000;
    }

    #headerPic {
        border: 1px solid #444;
    }

    #headerName {
        color: #fff;
        font-weight: 600;
    }

    /* ================= MESSAGES AREA ================= */

    #chatBox {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #050505;
    }

    /* Hide scrollbar */
    #chatBox::-webkit-scrollbar {
        width: 5px;
    }

    #chatBox::-webkit-scrollbar-track {
        background: #000;
    }

    #chatBox::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 10px;
    }

    /* ================= MESSAGE BUBBLES ================= */

    .msg {
        max-width: 75%;
        padding: 10px 15px;
        border-radius: 15px;
        font-size: 0.95rem;
        line-height: 1.4;
        word-wrap: break-word;
    }

    /* Sent messages */
    .sent {
        align-self: flex-end;
        background: #fff;
        color: #000;
        border-bottom-right-radius: 2px;
    }

    /* Received messages */
    .received {
        align-self: flex-start;
        background: #1a1a1a;
        color: #fff;
        border: 1px solid #333;
        border-bottom-left-radius: 2px;
    }

    /* ================= INPUT AREA ================= */

    .input-area {
        background: #000;
        padding: 12px 15px;
        display: flex;
        gap: 10px;
        border-top: 1px solid #333;
        flex-shrink: 0;
    }

    input {
        flex: 1;
        padding: 12px 18px;
        border-radius: 50px;
        border: 1px solid #444;
        background: #111;
        color: #fff;
        outline: none;
        height: auto;
        min-height: 42px;
    }

    input::placeholder {
        color: #777;
    }

    input:focus {
        border-color: #fff;
    }

    /* ================= SEND BUTTON ================= */

    button#sendBtn {
        background: #fff;
        color: #000;
        border: none;
        padding: 0 20px;
        border-radius: 25px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s ease;
    }

    button#sendBtn:hover {
        background: #ccc;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 500px) {

        .chat-header {
            padding: 10px;
            gap: 10px;
        }

        .back-btn {
            font-size: 1.3rem;
            padding: 5px;
        }

        #headerPic {
            width: 38px !important;
            height: 38px !important;
        }

        #headerName {
            font-size: 1rem !important;
        }

        #chatBox {
            padding: 12px;
        }

        .msg {
            max-width: 82%;
            font-size: 0.9rem;
            padding: 9px 12px;
        }

        .input-area {
            padding: 10px;
            gap: 7px;
        }

        input {
            padding: 10px 15px;
            min-width: 0;
        }

        button#sendBtn {
            padding: 0 15px;
        }
    }
</style>
</head>
<body>

    <div class="chat-header">
        <button class="back-btn" onclick="location.href='inbox.html'">←</button>
        <img id="headerPic" src="images/default.png" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
        <h3 id="headerName" style="margin:0; font-size:1.1rem;">Loading...</h3>
    </div>

    <div id="chatBox">
        </div>

    <div class="input-area">
        <input type="text" id="messageInput" placeholder="Write a message...">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const BASE_URL = "http://localhost:5000";
        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get("id"); // Who we are talking to
        const loggedInUser = JSON.parse(localStorage.getItem("user"));

        if (!loggedInUser || !targetUserId) {
            window.location.href = "login.html";
        }

        // 1. Load the other person's info for the header
        async function loadHeader() {
            try {
                const res = await fetch(`${BASE_URL}/auth/user/${targetUserId}`);
                const user = await res.json();
                document.getElementById("headerName").textContent = user.name;
                if (user.profile_image) {
                    document.getElementById("headerPic").src = `${BASE_URL}/uploads/${user.profile_image}`;
                }
            } catch (err) {
                console.error("Header load failed");
            }
        }

        // 2. Load the message history
        async function loadMessages() {
            try {
                const res = await fetch(`${BASE_URL}/messages/history/${loggedInUser.id}/${targetUserId}`);
                const messages = await res.json();

                const chatBox = document.getElementById("chatBox");
                // Check if we need to scroll (if user is at bottom)
                const shouldScroll = chatBox.scrollTop + chatBox.clientHeight === chatBox.scrollHeight;

                chatBox.innerHTML = messages.map(m => `
                    <div class="msg ${m.sender_id == loggedInUser.id ? 'sent' : 'received'}">
                        ${m.message}
                        <div style="font-size:0.7rem; opacity:0.6; margin-top:4px; text-align:right;">
                            ${new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                        </div>
                    </div>
                `).join("");

                chatBox.scrollTop = chatBox.scrollHeight; 
            } catch (err) {
                console.error("Failed to load messages");
            }
        }

        // 3. Send a message
        async function sendMessage() {
            const input = document.getElementById("messageInput");
            const message = input.value.trim();
            if (!message) return;

            try {
                const res = await fetch(`${BASE_URL}/messages/send`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        sender_id: loggedInUser.id,
                        receiver_id: targetUserId,
                        message: message
                    })
                });

                if (res.ok) {
                    input.value = "";
                    loadMessages(); // Refresh UI
                }
            } catch (err) {
                alert("Could not send message");
            }
        }

        // Support "Enter" key to send
        document.getElementById("messageInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        // Initialize
        loadHeader();
        loadMessages();
        
        // Auto-refresh every 3 seconds
        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
