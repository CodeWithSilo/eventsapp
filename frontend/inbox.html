<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Inbox</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow-y: auto;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* ================= NAVIGATION ================= */

        header {
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 100;
            background: #000;
            border-bottom: 1px solid #262626;
        }

        nav {
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 12px 10px;
            background: #000;
        }

        nav button {
            background: transparent;
            color: #a3a3a3;
            border: 1px solid transparent;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        nav button i {
            font-size: 0.95rem;
        }

        nav button:hover {
            color: #000;
            background: #fff;
            border-color: #fff;
        }

        /* ================= CONTAINER & TITLE ================= */

        .container {
            padding: 20px 16px;
            max-width: 550px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: #fff;
            margin: 20px 0 20px;
            font-size: 1.5rem;
        }

        /* ================= CHAT ITEM ================= */

        .chat-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #111;
            border: 1px solid #262626;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-item:hover {
            background: #1a1a1a;
            border-color: #555;
            transform: translateY(-2px);
        }

        .chat-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #333;
        }

        .chat-info {
            flex: 1;
            overflow: hidden;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h4 {
            margin: 0;
            font-size: 15px;
            color: #fff;
        }

        .chat-header small {
            color: #777;
            font-size: 11px;
        }

        .chat-message {
            margin: 5px 0 0 0;
            color: #aaa;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ================= MOBILE RESPONSIVENESS ================= */

        @media (max-width: 500px) {
            nav {
                padding: 10px 4px;
            }

            nav button {
                font-size: 0.75rem;
                padding: 6px 8px;
                gap: 4px;
            }

            nav button i {
                font-size: 0.85rem;
            }

            h2 {
                font-size: 1.25rem;
            }

            .container {
                padding: 12px 8px;
            }
        }
    </style>
</head>
<body>

    <!-- 100% Width Black and White Header -->
    <header>
        <nav>
            <button onclick="location.href='feed.html'">
                <i class="fa-solid fa-house"></i>
                <span>Feed</span>
            </button>
            <button onclick="location.href='create-post.html'">
                <i class="fa-solid fa-square-plus"></i>
                <span>Post</span>
            </button>
            <button onclick="location.href='inbox.html'">
                <i class="fa-solid fa-paper-plane"></i>
                <span>Inbox</span>
            </button>
            <button onclick="location.href='profile.html'">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </button>
        </nav>
    </header>

    <div class="container">
        <h2>Messages</h2>
        
        <div id="inboxContainer">
            <p style="color: #777; text-align: center;">Loading messages...</p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        async function loadInbox() {
            const user = JSON.parse(localStorage.getItem("user"));
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            try {
                const res = await fetch(`${BASE_URL}/messages/inbox/${user.id}`);
                const chats = await res.json();

                const container = document.getElementById("inboxContainer");
                
                if (chats.length === 0) {
                    container.innerHTML = "<p style='text-align:center; color:#777;'>No conversations yet.</p>";
                    return;
                }

                container.innerHTML = chats.map(chat => `
                    <div class="chat-item" onclick="location.href='chat.html?id=${chat.other_user_id}'">
                        
                        <img src="${chat.profile_image ? `${BASE_URL}/uploads/${chat.profile_image}` : 'images/default.png'}" 
                            class="chat-avatar">
                        
                        <div class="chat-info">
                            <div class="chat-header">
                                <h4>${chat.name}</h4>
                                <small>${new Date(chat.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</small>
                            </div>
                            <p class="chat-message">${chat.message}</p>
                        </div>
                    </div>
                `).join("");

            } catch (err) {
                console.error("Inbox error:", err);
                document.getElementById("inboxContainer").innerHTML = "<p style='text-align:center; color:#777;'>Error loading inbox.</p>";
            }
        }

        loadInbox();
        setInterval(loadInbox, 10000);
    </script>
</body>
</html>
