<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Campus Feed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px 16px;
        }
        header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
        }
        header button {
            background: transparent;
            border: 1px solid #262626;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        header h1 { font-size: 1.1rem; font-weight: 600; }
        
        .profile-card {
            background: #0a0a0a;
            border: 1px solid #262626;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 24px;
        }
        .profile-card img {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
            margin-bottom: 14px;
        }
        .profile-card h2 { font-size: 1.25rem; margin-bottom: 4px; color: #ffffff; }
        .profile-card p { color: #a3a3a3; font-size: 0.88rem; margin-bottom: 6px; }
        
        .message-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            margin-top: 14px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
            border-bottom: 1px solid #262626;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <button onclick="window.history.back()">← Back</button>
            <h1 id="header-title">Student Profile</h1>
        </header>

        <!-- User Bio Info Container -->
        <div id="profile-info-container">
            <p style="text-align: center; color: #737373; padding: 20px;">Loading profile...</p>
        </div>

        <!-- User Posts Container -->
        <h3 class="section-title">Student Posts</h3>
        <div id="user-posts-container">
            <p style="text-align: center; color: #737373; padding: 20px;">Loading posts...</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="user-profile.js"></script>
</body>
</html>
