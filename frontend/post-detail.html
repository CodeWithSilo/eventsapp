<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Details - Campus Feed</title>
  <link rel="stylesheet" href="style.css"> <!-- Link your global styles -->
</head>
<body style="background: #000000; color: #ffffff; font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto;">

  <button onclick="history.back()" style="background: #171717; color: #ffffff; border: 1px solid #262626; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-bottom: 20px;">
    ← Back
  </button>

  <div id="single-post-container">
    <p style="text-align: center; color: #737373;">Loading post...</p>
  </div>

  <!-- Include your config file for BASE_URL -->
  <script src="config.js"></script>
  <script>
    const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23a3a3a3'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.8-.85-5.05-2.2.03-1.68 3.37-2.6 5.05-2.6s5.02.92 5.05 2.6C15.8 19.15 14.03 20 12 20z'/></svg>";

    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get("id");
      if (!postId) {
        document.getElementById("single-post-container").innerHTML = "<p>Post not found.</p>";
        return;
      }
      loadSinglePost(postId);
    });

    async function loadSinglePost(postId) {
      try {
        const res = await fetch(`${BASE_URL}/api/posts`);
        const posts = await res.json();
        const post = posts.find(p => p.id == postId);

        if (!post) {
          document.getElementById("single-post-container").innerHTML = "<p>Post does not exist.</p>";
          return;
        }

        const container = document.getElementById("single-post-container");
        container.innerHTML = `
          <article style="background: #0a0a0a; border: 1px solid #262626; border-radius: 16px; padding: 20px; margin-bottom: 24px;">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
              <img src="${post.profile_image ? `${BASE_URL}/uploads/${post.profile_image}` : DEFAULT_AVATAR}" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover;" />
              <div>
                <h3 style="margin: 0; font-size: 1rem; color: #ffffff;">${escapeHTML(post.name || "Campus Student")}</h3>
                <small style="color: #737373;">${escapeHTML(post.date || "")}</small>
              </div>
            </div>

            <h4 style="margin: 0 0 8px 0; color: #ffffff;">${escapeHTML(post.title || "")}</h4>
            <p style="color: #d4d4d4; line-height: 1.6;">${escapeHTML(post.description || "")}</p>
            
            ${post.image ? `<img src="${BASE_URL}/uploads/${post.image}" style="width: 100%; border-radius: 12px; margin-top: 12px;" />` : ""}
          </article>

          <!-- Comments Section -->
          <h3 style="font-size: 1.1rem; margin-bottom: 12px;">Comments</h3>
          <div id="comments-list" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
            ${(post.comments || []).length === 0 ? '<p style="color: #737373; font-size: 0.9rem;">No comments yet. Be the first to reply!</p>' : 
              post.comments.map(c => `
                <div style="background: #0a0a0a; border: 1px solid #262626; padding: 12px; border-radius: 10px; display: flex; gap: 10px;">
                  <img src="${c.profile_image ? `${BASE_URL}/uploads/${c.profile_image}` : DEFAULT_AVATAR}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover;" />
                  <div>
                    <strong style="color: #ffffff; font-size: 0.88rem;">${escapeHTML(c.name)}</strong>
                    <p style="margin: 4px 0 0 0; color: #d4d4d4; font-size: 0.9rem;">${escapeHTML(c.comment_text || c.comment)}</p>
                  </div>
                </div>
              `).join("")}
          </div>

          <!-- Add Comment Input Box -->
          <div style="display: flex; gap: 8px;">
            <input id="new-comment-text" type="text" placeholder="Write a reply..." style="flex: 1; background: #0a0a0a; color: #ffffff; border: 1px solid #262626; padding: 12px; border-radius: 20px; outline: none;" />
            <button onclick="submitComment(${post.id})" style="background: #ffffff; color: #000000; border: none; padding: 0 20px; border-radius: 20px; font-weight: 600; cursor: pointer;">Post</button>
          </div>
        `;
      } catch (err) {
        console.error(err);
      }
    }

    async function submitComment(postId) {
      const input = document.getElementById("new-comment-text");
      const comment = input.value.trim();
      const user = JSON.parse(localStorage.getItem("user"));

      if (!user) return alert("Please log in to comment.");
      if (!comment) return;

      try {
        const res = await fetch(`${BASE_URL}/api/comments`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ post_id: postId, user_id: user.id, comment })
        });

        if (res.ok) {
          location.reload(); // Refresh to display the new comment
        } else {
          alert("Failed to add comment.");
        }
      } catch (err) {
        console.error(err);
      }
    }

    function escapeHTML(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
