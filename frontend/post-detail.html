<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Detail - Campus Feed</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px 16px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
        }

        header button {
            background: transparent;
            border: 1px solid #262626;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Comment Input Styling */
        .comment-input-box {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            align-items: center;
        }

        .comment-input-box input {
            flex: 1;
            background: #000000;
            color: #ffffff;
            border: 1px solid #262626;
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 0.88rem;
            outline: none;
        }

        .comment-input-box button {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <button onclick="window.history.back()">← Back</button>
            <h1>Post & Comments</h1>
        </header>

        <!-- Dynamic Post Container -->
        <main id="single-post-container">
            <p style="text-align: center; color: #737373; padding: 40px;">Loading post...</p>
        </main>
    </div>

    <script src="config.js"></script>
    <script src="post-detail.js"></script>
</body>
</html>
